schema_version: '0.1'
experiment:
  name: local_detection_bbox_augmentation_smoke
  description: Local train-only detection bbox augmentation smoke.
  tags:
  - local
  - augmentation
  - detection
  - bbox
runtime:
  runner: local_simulator
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python
code:
  entrypoint: ../../local_remote_simulator/scripts/mock_train.py
  working_dir: ../../local_remote_simulator
  args: []
  package_include:
  - scripts/mock_train.py
  - datasets/augmentation_policy_fixture/**
  package_exclude: []
train:
  args:
  - --epochs
  - '1'
  - --model
  - detection_bbox_augmentation_smoke
  - --dataset
  - augmentation_policy_fixture
  env: {}
  max_seconds: 120
  fail_fast: true
data_variants:
- id: augmentation_policy_fixture
  kind: original
  path: ../../local_remote_simulator/datasets/augmentation_policy_fixture
  enabled: true
- id: augmentation_detection_dataset
  kind: augmentation
  source: augmentation_policy_fixture
  enabled: true
tasks:
- id: augment_detection_bboxes
  task_type: augmentation
  input_variant: augmentation_policy_fixture
  adapter: detection_bbox_augmentation_smoke
  enabled: true
  params:
    target_split: train
    policy_id: detection_bbox_flip_smoke_v1
    augmentation_recipe: horizontal_flip_bbox_xyxy_v1
    label_transform: horizontal_flip_bbox_xyxy
    preserve_original_sample_id: true
    preserve_split: true
    record_augmentation_id: true
    record_augmentation_recipe: true
    record_label_transform: true
- id: detect_augmented_dataset
  task_type: detection
  input_variant: augmentation_detection_dataset
  model_id: manifest_detection_smoke
  adapter: manifest_detection_smoke
  enabled: true
  depends_on:
  - augment_detection_bboxes
  params:
    default_class_id: tank
    score: 0.95
    batch_size: 8
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: false
  save_previews: true
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/**/*.json
  - tasks/**/inputs/**/*
  - tasks/**/augmented_images/**/*
analysis:
  primary_metric: map50
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/detection_bbox_augmentation_experiments.sqlite3
