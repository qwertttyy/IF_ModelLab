schema_version: '0.1'
experiment:
  name: gpu_yolo_detection_m1a2_smoke
  description: Remote GPU YOLO detection train smoke on imported M1a2 export data.
  tags:
  - ssh
  - gpu
  - detection
  - yolo
  - train
  - m1a2
runtime:
  runner: ssh
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python3
code:
  entrypoint: ../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - src/**
  - runs/user_datasets/export_20260615_224531/detection/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 900
  fail_fast: true
data_variants:
- id: m1a2_detection
  kind: original
  path: ../../runs/user_datasets/export_20260615_224531/detection
  enabled: true
tasks:
- id: train_yolo_detector
  task_type: detection
  input_variant: m1a2_detection
  model_id: yolo11n
  adapter: ultralytics_yolo
  enabled: true
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: true
    epochs: 3
    image_size: 640
    batch_size: 16
    learning_rate: 0.001
    device: '0'
    workers: 2
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: map50
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/gpu_yolo_detection_m1a2_experiments.sqlite3
