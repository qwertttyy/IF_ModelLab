schema_version: '0.1'
experiment:
  name: 'ssh_gpu_mock_smoke'
  description: 'Short real SSH GPU-server smoke using the mock training script. This validates the remote lifecycle, not model quality.'
  tags:
    - 'ssh'
    - 'gpu-smoke'
    - 'mock'
runtime:
  runner: 'ssh'
  workspace: '../../runs/workspaces'
  experiment_root: '../../runs/experiments'
  python_executable: 'python'
  remote_python_executable: 'python3'
code:
  entrypoint: '../../local_remote_simulator/scripts/mock_train.py'
  working_dir: '../../local_remote_simulator/scripts'
  args: []
train:
  args:
    - '--epochs'
    - '2'
  env: {}
  max_seconds: 120
  fail_fast: true
data_variants:
  - id: 'original'
    kind: 'original'
    path: '../../local_remote_simulator/datasets/original'
    enabled: true
tasks: []
output:
  log_file: 'train.log'
  metrics_file: 'metrics.csv'
  checkpoint_file: 'best.pt'
  status_file: 'status.marker'
  summary_file: 'summary.md'
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: true
  collect_patterns:
    - 'train.log'
    - 'metrics.csv'
    - 'metrics.json'
    - 'best.pt'
    - 'last.pt'
    - 'status.marker'
    - 'summary.md'
    - 'experiment.json'
    - 'artifacts.json'
    - 'timings.csv'
    - 'task_results.json'
    - 'sample_predictions/*.json'
analysis:
  primary_metric: 'accuracy'
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: '../../runs/ironflow_experiments.sqlite3'
