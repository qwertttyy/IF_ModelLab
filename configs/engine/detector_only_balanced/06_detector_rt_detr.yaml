schema_version: '0.1'
experiment:
  name: recommended_detector_rt_detr
  description: Evaluate RT-DETR as an Ultralytics-supported detector-only transformer
    candidate.
  tags:
  - detector_only
  - detector_screening
  - gpu-balanced
  - recommended_matrix
  - ssh
runtime:
  runner: ssh
  workspace: ../../../runs/w
  experiment_root: ../../../runs/e
  python_executable: python
  remote_python_executable: auto
  container_mode: native_python
  container_image: ''
code:
  entrypoint: ../../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - scripts/external_wrapper_common.py
  - scripts/external_detection_wrappers/**
  - scripts/external_segmentation_wrappers/**
  - scripts/external_embedding_wrappers/**
  - models/checkpoints/pretrained/ultralytics/rtdetr-l.pt
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/detector_tank_av/detection/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 14400
  fail_fast: true
data_variants:
- id: model_name_detection
  kind: original
  source: null
  path: ../../../runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/detector_tank_av/detection
  enabled: true
  params: {}
tasks:
- id: train_detect_rt_detr
  task_type: detection
  input_variant: model_name_detection
  model_id: rt_detr
  adapter: rt_detr_detection
  enabled: true
  depends_on: []
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: false
    image_size: 640
    patience: 5
    external_train_command: python scripts/external_detection_wrappers/rt_detr_detection_wrapper.py
      --request "{request_json}"
    external_inference_command: python scripts/external_detection_wrappers/rt_detr_detection_wrapper.py
      --request "{request_json}"
    external_command_contract_mode: native
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 8
    checkpoint: models/checkpoints/pretrained/ultralytics/rtdetr-l.pt
- id: predict_detect_rt_detr
  task_type: detection
  input_variant: model_name_detection
  model_id: rt_detr
  adapter: rt_detr_detection
  enabled: true
  depends_on:
  - train_detect_rt_detr
  params:
    execution_mode: inference_smoke
    pretrained: true
    allow_pretrained_download: true
    image_size: 640
    patience: 5
    external_train_command: python scripts/external_detection_wrappers/rt_detr_detection_wrapper.py
      --request "{request_json}"
    external_inference_command: python scripts/external_detection_wrappers/rt_detr_detection_wrapper.py
      --request "{request_json}"
    external_command_contract_mode: native
    checkpoint_from_task_id: train_detect_rt_detr
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 8
    prediction_split: test
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  artifact_collection_mode: light
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: map50
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../../runs/recommended_detector_rt_detr_experiments.sqlite3
