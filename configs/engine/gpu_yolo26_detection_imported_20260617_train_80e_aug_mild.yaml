schema_version: '0.1'
experiment:
  name: gpu_yolo26_model_name_detection_imported_20260617_train_80e_aug_mild
  description: Remote GPU YOLO26n fine-tuning for 80 epochs at image size 640 with
    mild Ultralytics train-time augmentation on the imported 2026-06-17 model-name
    detection dataset.
  tags:
  - ssh
  - gpu
  - detection
  - yolo26
  - train
  - real_train
  - imported_20260617
  - combined_model_name_detection
  - model_name_detection
  - pretrained_checkpoint
  - epochs_80
  - img640
  - aug_mild
runtime:
  runner: ssh
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python3
code:
  entrypoint: ../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260630/detector_tank_av/detection/**
  - models/checkpoints/pretrained/ultralytics/yolo26n.pt
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 14400
  fail_fast: true
data_variants:
- id: imported_20260617_combined_model_name_detection
  kind: original
  path: ../../runs/user_datasets/tank_armor_prepared_v20260630/detector_tank_av/detection
  enabled: true
tasks:
- id: train_yolo26_model_name_detector_80e_aug_mild
  task_type: detection
  input_variant: imported_20260617_combined_model_name_detection
  model_id: yolo26n
  adapter: ultralytics_yolo
  enabled: true
  params:
    execution_mode: train
    pretrained: false
    allow_pretrained_download: false
    checkpoint: models/checkpoints/pretrained/ultralytics/yolo26n.pt
    epochs: 80
    image_size: 640
    batch_size: 16
    learning_rate: 0.001
    device: '0'
    workers: 2
    patience: 25
    seed: 42
    hsv_h: 0.015
    hsv_s: 0.5
    hsv_v: 0.3
    degrees: 3.0
    translate: 0.08
    scale: 0.35
    shear: 1.0
    perspective: 0.0005
    flipud: 0.0
    fliplr: 0.5
    mosaic: 0.7
    mixup: 0.05
    copy_paste: 0.0
    close_mosaic: 10
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: map50
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/gpu_yolo26_model_name_detection_imported_20260617_aug_experiments.sqlite3
