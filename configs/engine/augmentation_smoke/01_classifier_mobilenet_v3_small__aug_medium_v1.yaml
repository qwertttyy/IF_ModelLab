schema_version: '0.1'
experiment:
  name: smoke_aug_recommended_classifier_mobilenet_v3_small_medium_v1
  description: Train and evaluate MobileNetV3 Small as the fastest crop classifier
    baseline. | Augmented dataset policy=medium_v1
  tags:
  - classifier_only
  - classifier_screening
  - gpu-balanced
  - recommended_matrix
  - ssh
  - augmentation_ablation
  - aug_medium_v1
  - materialized_augmented_dataset
runtime:
  runner: ssh
  workspace: ../../../runs/w
  experiment_root: ../../../runs/e
  python_executable: python
  remote_python_executable: auto
  container_mode: native_python
  container_image: ''
code:
  entrypoint: ../../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - scripts/external_wrapper_common.py
  - scripts/external_detection_wrappers/**
  - scripts/external_segmentation_wrappers/**
  - scripts/external_embedding_wrappers/**
  - models/checkpoints/pretrained/torchvision/mobilenet_v3_small_imagenet.pt
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260630/classifier_mbt/crops/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 14400
  fail_fast: true
data_variants:
- id: model_name_classification_crops
  kind: original
  source: null
  path: ../../../runs/user_datasets/tank_armor_prepared_v20260630_aug/medium_v1/classifier_mbt/crops
  enabled: true
  params:
    augmentation_policy: medium_v1
    augmentation_materialization: train_augmented_val_test_original
tasks:
- id: train_classify_mobilenet_v3_small
  task_type: classification
  input_variant: model_name_classification_crops
  model_id: mobilenet_v3_small
  adapter: torchvision_classifier
  enabled: true
  depends_on: []
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: false
    image_size: 224
    top_k: 3
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 32
    learning_rate: 0.001
    scheduler: cosine
    min_learning_rate: 1.0e-05
    checkpoint: models/checkpoints/pretrained/torchvision/mobilenet_v3_small_imagenet.pt
- id: predict_classify_mobilenet_v3_small
  task_type: classification
  input_variant: model_name_classification_crops
  model_id: mobilenet_v3_small
  adapter: torchvision_classifier
  enabled: true
  depends_on:
  - train_classify_mobilenet_v3_small
  params:
    execution_mode: inference_smoke
    pretrained: true
    allow_pretrained_download: true
    image_size: 224
    top_k: 3
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0
    checkpoint_from_task_id: train_classify_mobilenet_v3_small
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 32
    prediction_split: test
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  artifact_collection_mode: light
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: macro_f1
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../../runs/recommended_classifier_mobilenet_v3_small_experiments_medium_v1.sqlite3
