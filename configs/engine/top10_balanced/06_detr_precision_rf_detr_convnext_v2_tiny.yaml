schema_version: '0.1'
experiment:
  name: recommended_detr_precision_rf_detr_convnext_v2_tiny
  description: Benchmark RF-DETR as the high-accuracy transformer detector direction
    from model_md.
  tags:
  - end_to_end
  - foundation_top10
  - gpu-balanced
  - recommended_matrix
  - ssh
runtime:
  runner: ssh
  workspace: ../../../runs/w
  experiment_root: ../../../runs/e
  python_executable: python
  remote_python_executable: auto
  container_mode: native_python
  container_image: ''
code:
  entrypoint: ../../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - scripts/external_wrapper_common.py
  - scripts/external_detection_wrappers/**
  - scripts/external_segmentation_wrappers/**
  - scripts/external_embedding_wrappers/**
  - models/checkpoints/pretrained/rf_detr/rf_detr_base.pth
  - models/checkpoints/pretrained/timm/convnext_v2_tiny_pretrained.pt
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/detector_tank_av/detection/**
  - runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/classifier_all/images/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 14400
  fail_fast: true
data_variants:
- id: model_name_detection
  kind: original
  source: null
  path: ../../../runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/detector_tank_av/detection
  enabled: true
  params: {}
- id: model_name_detector_crop
  kind: detector_crop
  source: model_name_detection
  path: null
  enabled: true
  params: {}
- id: model_name_classification_images
  kind: original
  source: null
  path: ../../../runs/user_datasets/tank_armor_prepared_v20260703_original_classifier_all_v1/classifier_all/images
  enabled: true
  params: {}
tasks:
- id: train_detect_rf_detr
  task_type: detection
  input_variant: model_name_detection
  model_id: rf_detr
  adapter: rf_detr_detection
  enabled: true
  depends_on: []
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: false
    image_size: 640
    patience: 5
    external_train_command: python scripts/external_detection_wrappers/rf_detr_detection_wrapper.py
      --request "{request_json}"
    external_inference_command: python scripts/external_detection_wrappers/rf_detr_detection_wrapper.py
      --request "{request_json}"
    external_command_contract_mode: native
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 8
    rf_detr_model_class: RFDETRBase
    checkpoint: models/checkpoints/pretrained/rf_detr/rf_detr_base.pth
- id: predict_detect_rf_detr
  task_type: detection
  input_variant: model_name_detection
  model_id: rf_detr
  adapter: rf_detr_detection
  enabled: true
  depends_on:
  - train_detect_rf_detr
  params:
    execution_mode: inference_smoke
    pretrained: true
    allow_pretrained_download: true
    image_size: 640
    patience: 5
    external_train_command: python scripts/external_detection_wrappers/rf_detr_detection_wrapper.py
      --request "{request_json}"
    external_inference_command: python scripts/external_detection_wrappers/rf_detr_detection_wrapper.py
      --request "{request_json}"
    external_command_contract_mode: native
    checkpoint_from_task_id: train_detect_rf_detr
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 8
    rf_detr_model_class: RFDETRBase
    prediction_split: test
- id: make_model_name_detector_crops
  task_type: preprocessing
  input_variant: model_name_detection
  model_id: null
  adapter: detection_to_classification_crop
  enabled: true
  depends_on:
  - predict_detect_rf_detr
  params:
    source_task_id: predict_detect_rf_detr
    input_source: detector_crop
    image_format: jpg
    padding_ratio: 0.08
    min_score: 0.0
    use_source_labels: true
    classification_dataset_id: model_name_detector_crops
    pretrained: true
    allow_pretrained_download: true
    device: cuda:0
    external_timeout_seconds: 14400
- id: train_classify_convnext_v2_tiny
  task_type: classification
  input_variant: model_name_classification_images
  model_id: convnext_v2_tiny
  adapter: timm_classifier
  enabled: true
  depends_on: []
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: false
    image_size: 224
    top_k: 3
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 32
    learning_rate: 0.001
    scheduler: cosine
    min_learning_rate: 1.0e-05
    checkpoint: models/checkpoints/pretrained/timm/convnext_v2_tiny_pretrained.pt
- id: predict_classify_convnext_v2_tiny
  task_type: classification
  input_variant: model_name_detector_crop
  model_id: convnext_v2_tiny
  adapter: timm_classifier
  enabled: true
  depends_on:
  - make_model_name_detector_crops
  - train_classify_convnext_v2_tiny
  params:
    execution_mode: inference_smoke
    pretrained: true
    allow_pretrained_download: true
    image_size: 224
    top_k: 3
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0
    checkpoint_from_task_id: train_classify_convnext_v2_tiny
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 30
    batch_size: 32
    prediction_split: test
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  artifact_collection_mode: light
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: accuracy
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../../runs/recommended_detr_precision_rf_detr_convnext_v2_tiny_experiments.sqlite3
