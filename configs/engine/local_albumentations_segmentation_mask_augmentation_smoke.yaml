schema_version: '0.1'
experiment:
  name: 'local_albumentations_segmentation_mask_augmentation_smoke'
  description: 'Local Albumentations image+mask augmentation smoke for segmentation-style manifests.'
  tags:
    - 'local'
    - 'augmentation'
    - 'albumentations'
    - 'segmentation'
    - 'mask'
runtime:
  runner: 'local_simulator'
  workspace: '../../runs/workspaces'
  experiment_root: '../../runs/experiments'
  python_executable: 'python'
  remote_python_executable: 'python'
code:
  entrypoint: '../../local_remote_simulator/scripts/mock_train.py'
  working_dir: '../../local_remote_simulator'
  args: []
  package_include:
    - 'scripts/mock_train.py'
    - 'datasets/segmentation_mask_fixture/**'
  package_exclude: []
train:
  args:
    - '--epochs'
    - '1'
    - '--model'
    - 'albumentations_segmentation_mask_augmentation_smoke'
    - '--dataset'
    - 'segmentation_mask_fixture'
  env: {}
  max_seconds: 120
  fail_fast: true
data_variants:
  - id: 'segmentation_mask_fixture'
    kind: 'original'
    path: '../../local_remote_simulator/datasets/segmentation_mask_fixture'
    enabled: true
  - id: 'segmentation_mask_augmented'
    kind: 'augmentation'
    source: 'segmentation_mask_fixture'
    enabled: true
tasks:
  - id: 'augment_segmentation_masks'
    task_type: 'augmentation'
    input_variant: 'segmentation_mask_fixture'
    adapter: 'albumentations_segmentation_mask'
    enabled: true
    params:
      target_split: 'train'
      policy_id: 'albumentations_segmentation_mask_v1'
      augmentation_recipe: 'albumentations_mask_horizontal_flip_v1'
      label_transform: 'albumentations_image_mask'
      seed: 20260616
      transforms:
        - name: 'HorizontalFlip'
          p: 1.0
        - name: 'RandomBrightnessContrast'
          brightness_limit: 0.1
          contrast_limit: 0.1
          p: 1.0
      preserve_original_sample_id: true
      preserve_split: true
      record_augmentation_id: true
      record_augmentation_recipe: true
      record_label_transform: true
output:
  log_file: 'train.log'
  metrics_file: 'metrics.csv'
  checkpoint_file: 'best.pt'
  status_file: 'status.marker'
  summary_file: 'summary.md'
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: false
  save_previews: true
  collect_patterns:
    - 'train.log'
    - 'metrics.csv'
    - 'metrics.json'
    - 'status.marker'
    - 'summary.md'
    - 'experiment.json'
    - 'artifacts.json'
    - 'timings.csv'
    - 'task_results.json'
    - 'tasks/**/*.json'
    - 'tasks/**/inputs/**/*'
    - 'tasks/**/augmented_images/**/*'
    - 'tasks/**/augmented_masks/**/*'
analysis:
  primary_metric: 'accuracy'
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: '../../runs/albumentations_segmentation_mask_augmentation_experiments.sqlite3'
