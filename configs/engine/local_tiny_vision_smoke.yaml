schema_version: '0.1'
experiment:
  name: local_tiny_vision_smoke
  description: Local dependency-light image artifact smoke configuration.
  tags:
  - local
  - tiny-vision
  - image-artifacts
runtime:
  runner: local_simulator
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python
code:
  entrypoint: ../../local_remote_simulator/scripts/tiny_vision_smoke.py
  working_dir: ../../local_remote_simulator/scripts
  args: []
  package_include:
  - tiny_vision_smoke.py
  - ../datasets/tiny_vision_fixture/**
  package_exclude: []
train:
  args:
  - --epochs
  - '2'
  - --dataset-dir
  - ../datasets/tiny_vision_fixture
  env: {}
  max_seconds: 120
  fail_fast: true
data_variants:
- id: tiny_vision_fixture
  kind: original
  path: ../../local_remote_simulator/datasets/tiny_vision_fixture
  enabled: true
tasks:
- id: classify_tiny_fixture
  task_type: classification
  input_variant: tiny_vision_fixture
  model_id: tiny_vision_smoke
  adapter: tiny_vision_smoke
  enabled: true
  params:
    top_k: 2
    batch_size: 32
- id: detect_tiny_fixture
  task_type: detection
  input_variant: tiny_vision_fixture
  model_id: tiny_vision_smoke
  adapter: tiny_vision_smoke
  enabled: true
  params:
    confidence_threshold: 0.25
    batch_size: 8
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: false
  save_previews: true
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - predictions/*.json
  - previews/samples/*.ppm
analysis:
  primary_metric: accuracy
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/tiny_vision_experiments.sqlite3
