schema_version: '0.1'
experiment:
  name: local_cpu_rule_vision_smoke
  description: Local CPU-only file-backed vision smoke with a slightly larger image
    fixture.
  tags:
  - local
  - test-model
  - cpu-only
  - image-artifacts
runtime:
  runner: local_simulator
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python
code:
  entrypoint: ../../local_remote_simulator/scripts/test_model_smoke.py
  working_dir: ../../local_remote_simulator
  args: []
  package_include:
  - scripts/test_model_smoke.py
  - datasets/small_vision_fixture/**
  - test_models/cpu_rule_vision_v1/**
  package_exclude: []
train:
  args:
  - --epochs
  - '3'
  - --dataset-dir
  - datasets/small_vision_fixture
  - --model-dir
  - test_models/cpu_rule_vision_v1
  env: {}
  max_seconds: 120
  fail_fast: true
data_variants:
- id: small_vision_fixture
  kind: original
  path: ../../local_remote_simulator/datasets/small_vision_fixture
  enabled: true
tasks:
- id: classify_small_fixture
  task_type: classification
  input_variant: small_vision_fixture
  model_id: cpu_rule_vision_v1
  adapter: test_model_smoke
  enabled: true
  params:
    source: model_files
    batch_size: 32
- id: detect_small_fixture
  task_type: detection
  input_variant: small_vision_fixture
  model_id: cpu_rule_vision_v1
  adapter: test_model_smoke
  enabled: true
  params:
    source: model_files
    batch_size: 8
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: false
  save_previews: true
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - model_snapshot.json
  - timings.csv
  - task_results.json
  - predictions/*.json
  - previews/samples/*.ppm
analysis:
  primary_metric: accuracy
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/cpu_rule_vision_experiments.sqlite3
