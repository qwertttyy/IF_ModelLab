schema_version: '0.1'
experiment:
  name: gpu_timm_model_name_classification_imported_20260617_train
  description: Remote GPU timm ConvNeXt V2 Tiny fine-tuning on imported 2026-06-17
    object crop classification data.
  tags:
  - ssh
  - gpu
  - classification
  - timm
  - convnext_v2_tiny
  - train
  - real_train
  - imported_20260617
  - combined_model_name_classification
  - object_crop
  - pretrained
runtime:
  runner: ssh
  workspace: ../../runs/workspaces
  experiment_root: ../../runs/experiments
  python_executable: python
  remote_python_executable: python3
code:
  entrypoint: ../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260630/classifier_mbt/crops/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 3600
  fail_fast: true
data_variants:
- id: imported_20260617_combined_model_name_classification_crops
  kind: original
  path: ../../runs/user_datasets/tank_armor_prepared_v20260630/classifier_mbt/crops
  enabled: true
tasks:
- id: train_timm_model_name_classifier
  task_type: classification
  input_variant: imported_20260617_combined_model_name_classification_crops
  model_id: convnext_v2_tiny
  adapter: timm_classifier
  enabled: true
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: true
    epochs: 30
    image_size: 224
    batch_size: 32
    learning_rate: 0.0005
    device: cuda:0
    workers: 2
    early_stopping_patience: 8
    early_stopping_min_delta: 0.0
    seed: 42
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: accuracy
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../runs/gpu_timm_model_name_classification_imported_20260617_experiments.sqlite3
