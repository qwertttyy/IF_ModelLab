schema_version: '0.1'
experiment:
  name: recommended_classifier_resnext50_32x4d
  description: Train and evaluate ResNeXt-50 32x4d as a stronger residual CNN crop
    classifier.
  tags:
  - classifier_only
  - classifier_screening
  - gpu-balanced
  - recommended_matrix
  - ssh
runtime:
  runner: ssh
  workspace: ../../../runs/w
  experiment_root: ../../../runs/e
  python_executable: python
  remote_python_executable: auto
  container_mode: native_python
  container_image: ''
code:
  entrypoint: ../../../src/ironflow_exp/engine/remote_task_adapter.py
  working_dir: ../../..
  args: []
  package_include:
  - pyproject.toml
  - configs/model_catalog/**
  - scripts/external_wrapper_common.py
  - scripts/external_detection_wrappers/**
  - scripts/external_segmentation_wrappers/**
  - scripts/external_embedding_wrappers/**
  - models/checkpoints/pretrained/torchvision/resnext50_32x4d_imagenet.pt
  - src/**
  - runs/user_datasets/tank_armor_prepared_v20260705_original_classifier_all_aug_weak_v1/classifier_all/images/**
  package_exclude: []
train:
  args: []
  env: {}
  max_seconds: 14400
  fail_fast: true
data_variants:
- id: model_name_classification_images
  kind: original
  source: null
  path: ../../../runs/user_datasets/tank_armor_prepared_v20260705_original_classifier_all_aug_weak_v1/classifier_all/images
  enabled: true
  params: {}
tasks:
- id: train_classify_resnext50_32x4d
  task_type: classification
  input_variant: model_name_classification_images
  model_id: resnext50_32x4d
  adapter: torchvision_classifier
  enabled: true
  depends_on: []
  params:
    execution_mode: train
    pretrained: true
    allow_pretrained_download: false
    image_size: 224
    top_k: 3
    early_stopping_patience: 8
    early_stopping_min_delta: 0.0
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 50
    batch_size: 32
    learning_rate: 0.001
    scheduler: cosine
    min_learning_rate: 1.0e-05
    checkpoint: models/checkpoints/pretrained/torchvision/resnext50_32x4d_imagenet.pt
- id: predict_classify_resnext50_32x4d
  task_type: classification
  input_variant: model_name_classification_images
  model_id: resnext50_32x4d
  adapter: torchvision_classifier
  enabled: true
  depends_on:
  - train_classify_resnext50_32x4d
  params:
    execution_mode: inference_smoke
    pretrained: true
    allow_pretrained_download: true
    image_size: 224
    top_k: 3
    early_stopping_patience: 8
    early_stopping_min_delta: 0.0
    checkpoint_from_task_id: train_classify_resnext50_32x4d
    device: cuda:0
    external_timeout_seconds: 14400
    epochs: 50
    batch_size: 32
    prediction_split: test
output:
  log_file: train.log
  metrics_file: metrics.csv
  checkpoint_file: best.pt
  status_file: status.marker
  summary_file: summary.md
  save_json: true
  save_csv: true
  save_summary: true
  save_checkpoints: true
  save_previews: false
  artifact_collection_mode: light
  collect_patterns:
  - train.log
  - metrics.csv
  - metrics.json
  - status.marker
  - summary.md
  - experiment.json
  - artifacts.json
  - timings.csv
  - task_results.json
  - tasks/
analysis:
  primary_metric: macro_f1
  higher_is_better: true
  failure_rules_enabled: true
repository:
  sqlite_path: ../../../runs/recommended_classifier_resnext50_32x4d_experiments.sqlite3
