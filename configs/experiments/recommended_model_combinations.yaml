deferred_foundation_combinations:
  - id: 'open_vocab_grounding_dino_sam2_dinov3_audit'
    reason: 'GroundingDINO is not a supervised training path yet, and DINOv3 pretrained weights require permitted local/cache access.'
  - id: 'segmentation_supervised_yolo11n_seg_efficientnet_b0'
    reason: 'Requires reliable mask/polygon data before it belongs in the real-training Top10.'
  - id: 'classic_cnn_yolo11n_resnet50_bytetrack'
    reason: 'Useful baseline, but lower priority than RF-DETR/D-FINE/RT-DETR and foundation review workflows.'
  - id: 'transformer_crop_yolo11n_vit_tiny_bytetrack'
    reason: 'Useful classifier contrast, but lower priority than DINO/CLIP embedding review for this project.'

experiment_matrices:
  - id: 'gpu_classification_crop_matrix'
    stage: 'first_gpu_batch'
    fixed_steps:
      - task_type: 'detection'
        model_id: 'yolo11n'
        adapter_key: 'ultralytics_yolo_detection'
      - task_type: 'preprocessing'
        adapter_key: 'detection_to_classification_crop'
    axis:
      task_type: 'classification'
      input: 'detector_crop'
      candidates:
        - model_id: 'mobilenet_v3_small'
          adapter_key: 'torchvision_classifier'
        - model_id: 'mobilenet_v3_large'
          adapter_key: 'torchvision_classifier'
        - model_id: 'efficientnet_b0'
          adapter_key: 'torchvision_classifier'
        - model_id: 'efficientnet_b3'
